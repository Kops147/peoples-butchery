<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cashier Station — The Peoples Butchery</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #0A0A0A; color: #E0E0E0; min-height: 100vh; margin: 0; font-family: var(--font-body, sans-serif); }

    /* PIN screen */
    .pin-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .pin-box { background: #111; border: 1px solid #222; border-radius: 16px; padding: 40px; width: 340px; text-align: center; }
    .pin-box h2 { font-family: var(--font-head, sans-serif); margin: 0 0 6px; font-size: 1.4rem; }
    .pin-box p { color: #555; font-size: .85rem; margin: 0 0 24px; }
    .pin-input { width: 100%; background: #0A0A0A; border: 1px solid #2a2a2a; color: #e0e0e0; padding: 12px 16px; border-radius: 10px; font-size: 1.1rem; text-align: center; letter-spacing: 4px; box-sizing: border-box; margin-bottom: 12px; }
    .pin-input:focus { outline: none; border-color: #e8a020; }
    .pin-err { color: #ff4d4d; font-size: .8rem; min-height: 18px; }

    /* Header */
    .stn-header { background: #111; border-bottom: 2px solid #1a1a1a; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; gap: 12px; flex-wrap: wrap; }
    .stn-title { display: flex; align-items: center; gap: 10px; }
    .stn-title h1 { font-family: var(--font-head, sans-serif); font-size: 1.1rem; margin: 0; color: #fff; }
    .stn-badge { background: rgba(232,160,32,.12); border: 1px solid rgba(232,160,32,.3); color: #e8a020; padding: 3px 10px; border-radius: 20px; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #e8a020; display: inline-block; margin-right: 4px; animation: livepulse 2s infinite; }
    @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .stn-nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .stn-nav a { color: #555; text-decoration: none; font-size: .73rem; padding: 5px 10px; border: 1px solid #222; border-radius: 6px; transition: all .2s; white-space: nowrap; }
    .stn-nav a:hover { color: #aaa; border-color: #444; }
    .stn-nav a.active { color: #e8a020; border-color: rgba(232,160,32,.4); background: rgba(232,160,32,.05); }
    .stn-clock { font-size: .8rem; color: #444; white-space: nowrap; }
    .refresh-btn { background: transparent; border: 1px solid #2a2a2a; color: #555; padding: 5px 12px; border-radius: 6px; font-size: .75rem; cursor: pointer; transition: all .2s; }
    .refresh-btn:hover { color: #e8a020; border-color: rgba(232,160,32,.4); }

    /* Stats bar */
    .stats-bar { background: #0D0D0D; border-bottom: 1px solid #1a1a1a; padding: 10px 20px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
    .stat-chip { display: flex; align-items: center; gap: 8px; }
    .stat-num { font-family: var(--font-head, sans-serif); font-weight: 800; font-size: 1.4rem; }
    .stat-num.red { color: #ff4d4d; }
    .stat-num.amber { color: #f0a000; }
    .stat-num.green { color: #3DD68C; }
    .stat-num.blue { color: #3498db; }
    .stat-lbl { font-size: .72rem; color: #555; }

    /* Columns */
    .cashier-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: calc(100vh - 115px); overflow: hidden; }
    @media(max-width:900px){ .cashier-cols { grid-template-columns: 1fr; height: auto; overflow: visible; } }
    .col { display: flex; flex-direction: column; overflow: hidden; }
    .col:first-child { border-right: 1px solid #1a1a1a; }
    .col-head { padding: 14px 20px 10px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; gap: 10px; }
    .col-head h2 { margin: 0; font-size: .95rem; font-weight: 700; color: #ccc; }
    .col-cnt { background: #1a1a1a; color: #888; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
    .col-cnt.has-items { background: rgba(232,160,32,.15); color: #e8a020; }
    .col-scroll { overflow-y: auto; flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

    /* Order cards */
    .ocard { background: #141414; border: 1px solid #1e1e1e; border-radius: 12px; overflow: hidden; }
    .ocard.new-order { border-left: 3px solid #e8a020; }
    .ocard.butchering { border-left: 3px solid #ff4d4d; }
    .ocard.braai { border-left: 3px solid #f97316; }
    .ocard.packaging { border-left: 3px solid #8b5cf6; }
    .ocard.ready { border-left: 3px solid #3DD68C; }
    .ocard.dispatched { border-left: 3px solid #3498db; }

    .ocard-head { padding: 12px 14px 8px; display: flex; justify-content: space-between; align-items: flex-start; }
    .ocard-id { font-family: var(--font-head, sans-serif); font-weight: 800; font-size: 1rem; color: #ddd; }
    .ocard-time { font-size: .72rem; color: #444; }
    .ocard-status { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; padding: 3px 8px; border-radius: 4px; }
    .st-pending { background: rgba(232,160,32,.15); color: #e8a020; }
    .st-butchering { background: rgba(255,77,77,.15); color: #ff4d4d; }
    .st-braai { background: rgba(249,115,22,.15); color: #f97316; }
    .st-packaging { background: rgba(139,92,246,.15); color: #8b5cf6; }
    .st-ready { background: rgba(61,214,140,.15); color: #3DD68C; }
    .st-dispatched { background: rgba(52,152,219,.15); color: #3498db; }

    .ocard-body { padding: 0 14px 8px; }
    .ocard-customer { font-size: .88rem; font-weight: 600; color: #ccc; margin-bottom: 3px; }
    .ocard-phone { font-size: .78rem; color: #555; margin-bottom: 6px; }
    .ocard-items { font-size: .8rem; color: #888; line-height: 1.5; margin-bottom: 6px; }
    .item-line { display: flex; align-items: center; gap: 6px; }
    .item-braai { background: rgba(249,115,22,.15); color: #f97316; font-size: .68rem; font-weight: 700; padding: 1px 5px; border-radius: 3px; }
    .item-pap { background: rgba(61,214,140,.12); color: #3DD68C; font-size: .68rem; font-weight: 700; padding: 1px 5px; border-radius: 3px; }
    .ocard-delivery { font-size: .78rem; color: #444; margin-bottom: 4px; }
    .ocard-total { font-family: var(--font-head, sans-serif); font-weight: 800; font-size: 1.05rem; color: #e8a020; }

    .ocard-actions { padding: 10px 14px 12px; display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid #1a1a1a; }
    .act-btn { padding: 7px 12px; border-radius: 8px; font-size: .78rem; font-weight: 700; cursor: pointer; border: none; transition: opacity .15s; }
    .act-btn:hover { opacity: .85; }
    .act-btn:disabled { opacity: .4; cursor: default; }
    .btn-butcher { background: #ef4444; color: #fff; }
    .btn-kitchen { background: #f97316; color: #fff; }
    .btn-ready { background: #3DD68C; color: #000; }
    .btn-dispatch { background: #3498db; color: #fff; }
    .btn-cancel { background: #2a2a2a; color: #888; }

    .empty-col { text-align: center; padding: 60px 20px; color: #333; }
    .empty-col .ei { font-size: 2.5rem; margin-bottom: 10px; }
  </style>
</head>
<body>

<div id="toast-container"></div>

<!-- PIN Gate -->
<div id="pin-screen" class="pin-wrap">
  <div class="pin-box">
    <div style="font-size:2rem;margin-bottom:12px">🧾</div>
    <h2>Cashier Station</h2>
    <p>The Peoples Butchery — Staff Access</p>
    <input type="password" id="pin-input" class="pin-input" placeholder="Enter PIN" maxlength="30">
    <div class="pin-err" id="pin-err"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="checkPin()">Unlock</button>
  </div>
</div>

<!-- Main Screen -->
<div id="main-screen" style="display:none">
  <header class="stn-header">
    <div class="stn-title">
      <span class="live-dot"></span>
      <h1>Cashier Station</h1>
      <span class="stn-badge">The Peoples Butchery</span>
    </div>
    <nav class="stn-nav">
      <a href="cashier.html" class="active">🧾 Cashier</a>
      <a href="butcher.html">🔪 Butcher</a>
      <a href="kitchen.html">🔥 Kitchen</a>
      <a href="dispatch.html">🚗 Driver</a>
      <a href="admin.html">⚙️ Admin</a>
    </nav>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
      <span class="stn-clock" id="clock"></span>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-chip">
      <div class="stat-num red" id="cnt-new">0</div>
      <div class="stat-lbl">New Orders</div>
    </div>
    <div class="stat-chip">
      <div class="stat-num amber" id="cnt-prog">0</div>
      <div class="stat-lbl">In Progress</div>
    </div>
    <div class="stat-chip">
      <div class="stat-num blue" id="cnt-dispatch">0</div>
      <div class="stat-lbl">Awaiting Dispatch</div>
    </div>
    <div class="stat-chip">
      <div class="stat-num green" id="cnt-done">0</div>
      <div class="stat-lbl">Done Today</div>
    </div>
  </div>

  <div class="cashier-cols">
    <!-- Left: New Orders -->
    <div class="col">
      <div class="col-head">
        <h2>🔔 New Orders</h2>
        <span class="col-cnt" id="badge-new">0</span>
      </div>
      <div class="col-scroll" id="new-orders">
        <div class="empty-col"><div class="ei">📋</div>No new orders</div>
      </div>
    </div>

    <!-- Right: In Progress + Awaiting Dispatch -->
    <div class="col">
      <div class="col-head">
        <h2>⚙️ In Progress &amp; Dispatch</h2>
        <span class="col-cnt" id="badge-prog">0</span>
      </div>
      <div class="col-scroll" id="progress-orders">
        <div class="empty-col"><div class="ei">✅</div>All clear</div>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script type="module">
  import { supabase } from './js/supabase-config.js';
  const ADMIN_PIN = 'peoplesV2_2024';
  const SUPER_PIN = 'yType_Dev_2026';

  let _orders = [], _users = [], _products = [];

  // Clock
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  tick(); setInterval(tick, 1000);

  // PIN
  window.checkPin = function() {
    const val = document.getElementById('pin-input').value;
    if (val === ADMIN_PIN || val === SUPER_PIN) {
      document.getElementById('pin-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = 'block';
      loadData();
    } else {
      document.getElementById('pin-err').textContent = 'Incorrect PIN';
      document.getElementById('pin-input').value = '';
    }
  };
  document.getElementById('pin-input').addEventListener('keydown', e => { if (e.key === 'Enter') window.checkPin(); });

  // Load
  window.loadData = async function() {
    try {
      const [ordRes, usrRes, proRes] = await Promise.all([
        supabase.from('orders').select('*').not('status', 'in', '("delivered","collected","cancelled")').order('created_at', { ascending: false }),
        supabase.from('users').select('id,name,surname,phone,email'),
        supabase.from('products').select('id,name,unit')
      ]);
      if (!ordRes.error) _orders = ordRes.data || [];
      if (!usrRes.error) _users = usrRes.data || [];
      if (!proRes.error) _products = proRes.data || [];
      render();
    } catch(e) {
      showToast('Load failed: ' + e.message, 'error');
    }
  };

  function getUser(o) {
    return _users.find(u => u.id === o.user_id || u.email === o.user_email) || {};
  }
  function getProdName(id) {
    const p = _products.find(p => String(p.id) === String(id));
    return p ? p.name : `#${id}`;
  }
  function fmtTime(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' });
  }

  function itemsHtml(items) {
    if (!Array.isArray(items) || !items.length) return '<span style="color:#333">—</span>';
    return items.map(i => {
      const name = getProdName(i.productId || i.product_id);
      const qty = i.quantity || i.qty || 1;
      let tags = '';
      if (i.braai) tags += '<span class="item-braai">🔥 BRAAI</span>';
      if (i.pap > 0) tags += `<span class="item-pap">🍚 ×${i.pap} PAP</span>`;
      return `<div class="item-line">${qty}× <strong>${name}</strong>${tags}</div>`;
    }).join('');
  }

  function statusBadge(s) {
    const map = {
      pending: 'st-pending', butchering: 'st-butchering', braai: 'st-braai',
      packaging: 'st-packaging', ready: 'st-ready', dispatched: 'st-dispatched'
    };
    return `<span class="ocard-status ${map[s]||'st-pending'}">${s}</span>`;
  }

  function cardClass(s) {
    const m = { pending:'new-order', butchering:'butchering', braai:'braai', packaging:'packaging', ready:'ready', dispatched:'dispatched' };
    return m[s] || '';
  }

  function newOrderCard(o) {
    const u = getUser(o);
    const hasBraai = (o.items||[]).some(i => i.braai);
    const isDeliv = o.delivery_method === 'delivery';
    return `<div class="ocard ${cardClass(o.status)}" id="oc-${o.id}">
      <div class="ocard-head">
        <div>
          <div class="ocard-id">#${o.id.slice(-8).toUpperCase()}</div>
          <div class="ocard-time">${fmtTime(o.created_at)}</div>
        </div>
        ${statusBadge(o.status)}
      </div>
      <div class="ocard-body">
        <div class="ocard-customer">${u.name || ''} ${u.surname || ''}</div>
        <div class="ocard-phone">${u.phone || o.user_email || ''}</div>
        <div class="ocard-items">${itemsHtml(o.items)}</div>
        <div class="ocard-delivery">${isDeliv ? '🚗 Delivery — ' + (o.delivery_address||'') : '🏪 Collection'}</div>
        <div class="ocard-total">${formatCurrency(o.total)}</div>
      </div>
      <div class="ocard-actions">
        <button class="act-btn btn-butcher" onclick="allocate('${o.id}','butchering')">🔪 Butcher</button>
        ${hasBraai || true ? `<button class="act-btn btn-kitchen" onclick="allocate('${o.id}','braai')">🔥 Kitchen</button>` : ''}
        <button class="act-btn btn-cancel" onclick="allocate('${o.id}','cancelled')">✕ Cancel</button>
      </div>
    </div>`;
  }

  function progressCard(o) {
    const u = getUser(o);
    const isDeliv = o.delivery_method === 'delivery';
    const isPackaging = o.status === 'packaging';
    return `<div class="ocard ${cardClass(o.status)}">
      <div class="ocard-head">
        <div>
          <div class="ocard-id">#${o.id.slice(-8).toUpperCase()}</div>
          <div class="ocard-time">${fmtTime(o.created_at)}</div>
        </div>
        ${statusBadge(o.status)}
      </div>
      <div class="ocard-body">
        <div class="ocard-customer">${u.name || ''} ${u.surname || ''}</div>
        <div class="ocard-phone">${u.phone || o.user_email || ''}</div>
        <div class="ocard-items">${itemsHtml(o.items)}</div>
        <div class="ocard-delivery">${isDeliv ? '🚗 Delivery — ' + (o.delivery_address||'') : '🏪 Collection'}</div>
        <div class="ocard-total">${formatCurrency(o.total)}</div>
      </div>
      ${isPackaging ? `<div class="ocard-actions">
        ${isDeliv
          ? `<button class="act-btn btn-dispatch" onclick="allocate('${o.id}','dispatched')">🚗 Send to Driver</button>`
          : `<button class="act-btn btn-ready" onclick="allocate('${o.id}','ready')">✅ Mark Ready</button>`
        }
      </div>` : ''}
    </div>`;
  }

  function render() {
    const newOrders = _orders.filter(o => o.status === 'pending');
    const inProg = _orders.filter(o => ['butchering','braai','packaging'].includes(o.status));
    const awaiting = _orders.filter(o => ['ready','dispatched','delivering'].includes(o.status));
    const today = new Date().toDateString();
    // Count done today (need separate query or from the already-loaded but filtered data — approximate from what we have)

    document.getElementById('cnt-new').textContent = newOrders.length;
    document.getElementById('cnt-prog').textContent = inProg.length;
    document.getElementById('cnt-dispatch').textContent = awaiting.length;

    const badgeNew = document.getElementById('badge-new');
    badgeNew.textContent = newOrders.length;
    badgeNew.className = 'col-cnt' + (newOrders.length ? ' has-items' : '');

    const badgeProg = document.getElementById('badge-prog');
    badgeProg.textContent = inProg.length + awaiting.length;
    badgeProg.className = 'col-cnt' + ((inProg.length + awaiting.length) ? ' has-items' : '');

    const newEl = document.getElementById('new-orders');
    newEl.innerHTML = newOrders.length
      ? newOrders.map(newOrderCard).join('')
      : '<div class="empty-col"><div class="ei">🎉</div>No new orders</div>';

    const progEl = document.getElementById('progress-orders');
    const progAll = [...inProg, ...awaiting];
    progEl.innerHTML = progAll.length
      ? progAll.map(progressCard).join('')
      : '<div class="empty-col"><div class="ei">✅</div>All clear</div>';
  }

  window.allocate = async function(orderId, newStatus) {
    const btn = event.target;
    btn.disabled = true;
    try {
      const { error } = await supabase.from('orders').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', orderId);
      if (error) throw error;
      await loadData();
      showToast(`Order → ${newStatus}`, 'success');
    } catch(e) {
      showToast('Error: ' + e.message, 'error');
      btn.disabled = false;
    }
  };

  setInterval(loadData, 15000);
</script>
</body>
</html>
