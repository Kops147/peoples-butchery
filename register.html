  <script src="js/app.js"></script>
  <script src="js/suburbs.js"></script>
  <script src="js/delivery.js"></script>
  <script type="module">
    import { openMapModal } from './js/location-picker.js';
    window.openMapModal = openMapModal;
  </script>
  <script>
    // Wait for suburbs.js to load, then setup suburb autocomplete
    function setupSuburbAutocomplete() {
      const suburbInput = document.getElementById('r-suburb');
      const suburbSuggestions = document.getElementById('suburb-suggestions');
      
      if (!suburbInput || !window.filterSuburbs) {
        // Retry if suburbs.js not loaded yet
        setTimeout(setupSuburbAutocomplete, 100);
        return;
      }
      
      suburbInput.addEventListener('input', () => {
        const query = suburbInput.value.trim();
        if (query.length < 1) {
          suburbSuggestions.style.display = 'none';
          return;
        }
        const filtered = window.filterSuburbs(query);
        if (filtered.length === 0) {
          suburbSuggestions.style.display = 'none';
          return;
        }
        suburbSuggestions.innerHTML = filtered.map(suburb => 
          `<div class="delivery-suggestion-item" style="cursor:pointer">${suburb}</div>`
        ).join('');
        suburbSuggestions.style.display = 'block';
        
        suburbSuggestions.querySelectorAll('.delivery-suggestion-item').forEach(item => {
          item.addEventListener('click', () => {
            suburbInput.value = item.textContent;
            suburbSuggestions.style.display = 'none';
          });
        });
      });
      
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#r-suburb') && !e.target.closest('#suburb-suggestions')) {
          suburbSuggestions.style.display = 'none';
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('cancel-map-btn')?.addEventListener('click', () => {
        document.getElementById('map-modal-overlay')?.classList.remove('open');
      });
      setupSuburbAutocomplete();
    });
  </script>
  <script type="module">
    import { supabase } from './js/supabase-config.js';

    document.getElementById('google-register-btn').addEventListener('click', async () => {
      const btn = document.getElementById('google-register-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Connecting...';
      try {
        await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + '/dashboard.html' }
        });
      } catch (err) {
        showToast('Google sign-in failed: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google"> Continue with Google';
      }
    });

    let currentStep = 1;
    let pendingRef = '';
    let pendingCoords = null;
    let pendingDeliveryFee = null;

    // Redirect if already logged in
    if (Auth.isLoggedIn() && !Auth.isAdmin()) window.location.href = 'dashboard.html';

    // Toggle passwords
    ['toggle-pw1', 'toggle-pw2'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('click', function () {
        const inp = this.previousElementSibling;
        inp.type = inp.type === 'password' ? 'text' : 'password';
        this.textContent = inp.type === 'password' ? '👁️' : '🙈';
      });
    });

    function goToStep(n) {
      document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
      document.getElementById('step-' + n)?.classList.add('active');
      ['1', '2', '3'].forEach(i => {
        const item = document.getElementById('step-item-' + i);
        if (!item) return;
        item.classList.remove('active', 'done');
        if (parseInt(i) < n) item.classList.add('done');
        else if (parseInt(i) === n) item.classList.add('active');
      });
      currentStep = n;
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      if (el) { el.textContent = msg; el.classList.remove('hidden'); }
    }
    function hideError(id) { document.getElementById(id)?.classList.add('hidden'); }

    // Step 1 validation
    document.getElementById('step1-next').addEventListener('click', async () => {
      const name = document.getElementById('r-name').value.trim();
      const surname = document.getElementById('r-surname').value.trim();
      const email = document.getElementById('r-email').value.trim();
      const pw = document.getElementById('r-password').value;
      const conf = document.getElementById('r-confirm').value;
      let valid = true;

      if (!name) { showError('err-name', 'Please enter your first name'); valid = false; } else hideError('err-name');
      if (!surname) { showError('err-surname', 'Please enter your last name'); valid = false; } else hideError('err-surname');
      if (!email || !/\S+@\S+\.\S+/.test(email)) { showError('err-email', 'Please enter a valid email'); valid = false; } else hideError('err-email');
      if (pw.length < 6) { showError('err-password', 'Password must be at least 6 characters'); valid = false; } else hideError('err-password');
      if (pw !== conf) { showError('err-confirm', 'Passwords do not match'); valid = false; } else hideError('err-confirm');
      if (valid) goToStep(2);
    });

    document.getElementById('step2-back').addEventListener('click', () => goToStep(1));

    // Maps logic
    (function() {
      const openBtn = document.getElementById('reg-open-map-btn');
      const handleOpenMap = () => {
        if (typeof window.openMapModal !== 'function') {
          showToast('Map loading — type address and use Calculate Fee', 'warning');
          return;
        }
        window.openMapModal((location) => {
          document.getElementById('r-address').value = location.address;
          if (location.suburb) document.getElementById('r-suburb').value = location.suburb;
          pendingCoords = { lat: location.lat, lng: location.lng, suburb: location.suburb };
          hideError('err-address');
          const box = document.getElementById('delivery-estimate-box');
          box.classList.remove('hidden');
          const suburb = location.suburb || document.getElementById('r-suburb').value;
          const fee = window.calcDeliveryFeeBySuburb ? window.calcDeliveryFeeBySuburb(suburb) : calcDeliveryFee(pendingCoords);
          pendingDeliveryFee = fee;
          if (fee !== null) {
            document.getElementById('delivery-estimate-text').textContent =
              `Estimated delivery fee: R${fee.toFixed(2)} (${location.suburb || 'your area'})`;
          }
        });
      };
      openBtn?.addEventListener('click', handleOpenMap);
    })();

    // Delivery fee calculation
    document.getElementById('calc-delivery-btn').addEventListener('click', async () => {
      const suburb = document.getElementById('r-suburb').value.trim();
      const address = document.getElementById('r-address').value.trim();
      if (!suburb && !address) { showToast('Enter your suburb or address first', 'warning'); return; }
      
      const btn = document.getElementById('calc-delivery-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Calculating...';
      
      let fee = null;
      
      // Try suburb lookup first (accurate, hardcoded)
      if (suburb && window.calcDeliveryFeeBySuburb) {
        fee = window.calcDeliveryFeeBySuburb(suburb);
        const coords = window.getSuburbCoords(suburb);
        if (coords) {
          pendingCoords = { ...coords, suburb };
        }
      }
      
      // Fallback to address geocoding if suburb not found
      if (fee === null && address) {
        const coords = await geocodeAddress(address);
        if (coords) {
          pendingCoords = coords;
          fee = calcDeliveryFee(coords);
        }
      }
      
      const box = document.getElementById('delivery-estimate-box');
      box.classList.remove('hidden');
      
      if (fee !== null) {
        pendingDeliveryFee = fee;
        document.getElementById('delivery-estimate-text').textContent =
          `Estimated delivery fee: R${fee.toFixed(2)} (${suburb})`;
      } else {
        document.getElementById('delivery-estimate-text').textContent = 'Could not calculate fee. Will be updated at checkout.';
      }
      
      btn.disabled = false;
      btn.innerHTML = '🗺️ Calculate My Delivery Fee';
    });

    // Step 2 validation
    document.getElementById('step2-next').addEventListener('click', () => {
      const phone = document.getElementById('r-phone').value.trim();
      const suburb = document.getElementById('r-suburb').value.trim();
      const address = document.getElementById('r-address').value.trim();
      let valid = true;
      if (!phone) { showError('err-phone', 'Please enter your phone number'); valid = false; } else hideError('err-phone');
      if (!suburb) { showError('err-suburb', 'Please enter your suburb'); valid = false; } else hideError('err-suburb');
      if (!address) { showError('err-address', 'Please enter your delivery address'); valid = false; } else hideError('err-address');
      if (!valid) return;

      // Populate review
      const rName = document.getElementById('r-name').value.trim();
      const rSurname = document.getElementById('r-surname').value.trim();
      pendingRef = ensureUniqueRef(rName, rSurname, phone);
      document.getElementById('preview-ref').textContent = pendingRef;
      document.getElementById('rv-name').textContent = `${rName} ${rSurname}`;
      document.getElementById('rv-email').textContent = document.getElementById('r-email').value.trim();
      document.getElementById('rv-phone').textContent = phone;
      document.getElementById('rv-suburb').textContent = suburb;
      document.getElementById('rv-address').textContent = address;
      document.getElementById('rv-delivery').textContent = pendingDeliveryFee !== null
        ? `R${pendingDeliveryFee.toFixed(2)}`
        : 'Calculated at checkout';
      goToStep(3);
    });

    document.getElementById('step3-back').addEventListener('click', () => goToStep(2));

    // Submit
    document.getElementById('submit-btn').addEventListener('click', async () => {
      if (!document.getElementById('terms-check').checked) {
        showError('err-terms', 'You must accept the terms to continue');
        return;
      }
      hideError('err-terms');

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating Account...';

      const name = document.getElementById('r-name').value.trim();
      const surname = document.getElementById('r-surname').value.trim();
      const email = document.getElementById('r-email').value.trim();
      const password = document.getElementById('r-password').value;
      const phone = document.getElementById('r-phone').value.trim();
      const suburb = document.getElementById('r-suburb').value.trim();
      const address = document.getElementById('r-address').value.trim();
      const referredBy = document.getElementById('r-referral').value.trim().toUpperCase();

      // Try to get coords
      if (!pendingCoords) {
        const coords = window.getSuburbCoords ? window.getSuburbCoords(suburb) : null;
        if (coords) {
          pendingCoords = { ...coords, suburb };
        } else {
          pendingCoords = await geocodeAddress(suburb || address);
        }
      }

      try {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;

        const newUser = {
          id: data.user.id,
          email, name, surname, phone, suburb, address,
          ref_number: pendingRef,
          credit_balance: 0,
          is_admin: false
        };

        const { error: insertError } = await supabase.from('users').insert(newUser);
        if (insertError && !insertError.message.includes('duplicate')) throw insertError;

        const sessionUser = { ...newUser, refNumber: pendingRef, creditBalance: 0, isAdmin: false };
        const users = DB.getUsers();
        users.push(sessionUser);
        DB.saveUsers(users);

        Auth.login(sessionUser, data.session?.access_token ?? null);

        document.getElementById('success-ref').textContent = pendingRef;
        document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
        document.getElementById('step-success').classList.add('active');
        document.querySelector('.steps-indicator').style.display = 'none';

        if (!data.session) {
          const successEl = document.getElementById('step-success');
          if (successEl && !document.getElementById('email-confirm-notice')) {
            const notice = document.createElement('div');
            notice.id = 'email-confirm-notice';
            notice.className = 'alert alert-info mt-4';
            notice.style.cssText = 'text-align:left;font-size:0.88rem';
            notice.innerHTML = '📧 <strong>One more step:</strong> Check your email and click the confirmation link before logging in.';
            successEl.appendChild(notice);
          }
        }

      } catch (err) {
        btn.disabled = false;
        btn.textContent = '🎉 Create My Account';
        const msg = err.message?.includes('already registered') || err.message?.includes('duplicate')
          ? 'This email is already registered. Please login instead.'
          : (err.message || 'Registration failed. Please try again.');
        showToast('❌ ' + msg, 'error', 5000);
      }
    });
  </script>
</body>

</html>
