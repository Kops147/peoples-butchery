<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispatch Control — The Peoples Butchery</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #0A0A0A; color: #E0E0E0; }
    .ticket-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; padding: 20px; }
    .ticket-card { background: #141414; border: 1px solid #222; border-radius: 12px; padding: 20px; border-left: 4px solid #3498db; }
    .order-num { font-family: var(--font-head); font-weight: 800; font-size: 1.2rem; color: #3498db; }
    .badge-dept { background: #1A1A1A; color: #888; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
    .dispatch-info { margin: 15px 0; font-size: 0.85rem; color: #aaa; }
    .driver-selector { margin-top: 10px; background: #000; color: #fff; border: 1px solid #333; padding: 10px; width: 100%; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  
  <header style="padding: 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: baseline; gap: 15px;">
      <h1 style="font-size: 1.5rem; margin: 0;">Dispatch Control</h1>
      <span class="badge-dept">Fleet Management — Ready to Ship</span>
    </div>
    <div class="sponsor-brand">
       <svg width="120" height="34" viewBox="0 0 160 44">
        <rect width="160" height="44" rx="6" fill="#000"/>
        <text x="12" y="28" font-family="Arial" font-size="20" font-weight="800" fill="#3DD68C">yType</text>
        <path d="M85 8 L80 25 L88 25 L83 38 L95 20 L87 20 Z" fill="#3DD68C" />
      </svg>
    </div>
  </header>

  <main class="ticket-grid" id="ticket-container">
    <div style="grid-column: 1/-1; text-align: center; padding: 100px; color: #444;">
      <div style="font-size: 3rem; margin-bottom: 20px;">🚚</div>
      <h3>All quiet in Dispatch.</h3>
      <p>Orders ready for delivery or collection will appear here.</p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const DEPT = 'dispatch';
    
    async function fetchTickets() {
      try {
        const res = await fetch(`${API_BASE_URL}/tickets?department=${DEPT}`);
        const tickets = await res.json();
        renderTickets(Array.isArray(tickets) ? tickets : []);
      } catch (err) {
        console.error('Failed to fetch tickets:', err);
        document.getElementById('ticket-container').innerHTML = '<p style="color:#aaa;text-align:center;padding:20px">Could not connect to server</p>';
      }
    }

    function renderTickets(tickets) {
      const container = document.getElementById('ticket-container');
      if (tickets.length === 0) return;
      
      container.innerHTML = tickets.map(t => `
        <div class="ticket-card">
          <div class="ticket-header" style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <div class="order-num">#${t.order_number.slice(-6)}</div>
            <div class="badge ${t.method === 'delivery' ? 'badge-blue' : 'badge-gold'}">${t.method.toUpperCase()}</div>
          </div>
          <div class="dispatch-info">
            <div>📍 ${t.address || 'Collect at Store'}</div>
            ${t.distance ? `<div style="margin-top:5px;">📏 Distance: <strong>${t.distance}</strong></div>` : ''}
          </div>
          
          ${t.method === 'delivery' ? `
            <select class="driver-selector">
              <option>Assign Driver...</option>
              <option>Thabo (Bike 1)</option>
              <option>Sipho (Bike 2)</option>
              <option>Lerato (Car 1)</option>
            </select>
            <button class="btn btn-primary btn-full mt-4" onclick="updateTicket('${t.id}', 'dispatched')">Dispatch Order</button>
          ` : `
            <button class="btn btn-success btn-full" onclick="updateTicket('${t.id}', 'collected')">Handed to Customer</button>
          `}
        </div>
      `).join('');
    }

    async function updateTicket(id, status) {
      try {
        await fetch(`${API_BASE_URL}/tickets/${id}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        showToast(`Order ${status}!`, 'success');
      } catch (err) {
        showToast('Failed to update ticket', 'error');
      }
      setTimeout(fetchTickets, 500);
    }

    setInterval(fetchTickets, 5000);
    fetchTickets();
  </script>
</body>
</html>
