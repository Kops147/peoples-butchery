<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver — The Peoples Butchery</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #0A0A0A; color: #E0E0E0; min-height: 100vh; margin: 0; font-family: var(--font-body, sans-serif); }
    .stn-header { background: #111; border-bottom: 2px solid #1a1a1a; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; gap: 12px; flex-wrap: wrap; }
    .stn-title { display: flex; align-items: center; gap: 10px; }
    .stn-title h1 { font-family: var(--font-head, sans-serif); font-size: 1.1rem; margin: 0; color: #fff; }
    .stn-badge { background: rgba(52,152,219,.12); border: 1px solid rgba(52,152,219,.3); color: #3498db; padding: 3px 10px; border-radius: 20px; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #3498db; display: inline-block; margin-right: 4px; animation: livepulse 2s infinite; }
    @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .stn-nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .stn-nav a { color: #555; text-decoration: none; font-size: .73rem; padding: 5px 10px; border: 1px solid #222; border-radius: 6px; transition: all .2s; }
    .stn-nav a:hover { color: #aaa; border-color: #444; }
    .stn-nav a.active { color: #3498db; border-color: rgba(52,152,219,.4); background: rgba(52,152,219,.05); }
    .stn-clock { font-size: .8rem; color: #444; }

    .stats-bar { background: #0D0D0D; border-bottom: 1px solid #1a1a1a; padding: 10px 20px; display: flex; gap: 24px; align-items: center; }
    .stat-num { font-family: var(--font-head, sans-serif); font-weight: 800; font-size: 1.6rem; color: #3498db; }
    .stat-lbl { font-size: .72rem; color: #555; }

    .queue { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-content: start; }

    .ocard { background: #141414; border: 1px solid #1e1e1e; border-radius: 12px; overflow: hidden; }
    .ocard.delivering { border-left: 4px solid #3498db; }
    .ocard.ready-collect { border-left: 4px solid #3DD68C; }

    .ocard-head { padding: 14px 16px 8px; display: flex; justify-content: space-between; align-items: flex-start; }
    .ocard-id { font-family: var(--font-head, sans-serif); font-weight: 900; font-size: 1.3rem; color: #3498db; }
    .ready-collect .ocard-id { color: #3DD68C; }
    .ocard-time { font-size: .75rem; color: #444; margin-top: 2px; }

    .ocard-body { padding: 2px 16px 12px; }
    .ocard-customer { font-size: 1.1rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .ocard-phone { font-size: 1rem; color: #e8a020; font-weight: 600; margin-bottom: 10px; }
    .ocard-address { background: #1a1a1a; border-radius: 8px; padding: 12px 14px; font-size: .95rem; color: #ccc; line-height: 1.4; margin-bottom: 8px; }
    .ocard-address strong { color: #3498db; font-size: .72rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; }
    .ocard-total { font-family: var(--font-head, sans-serif); font-weight: 800; font-size: 1.15rem; color: #e8a020; }
    .ocard-items { font-size: .82rem; color: #555; margin-top: 4px; }

    .done-btn { display: block; margin: 12px 16px 16px; width: calc(100% - 32px); padding: 16px; border-radius: 10px; background: #3498db; color: #fff; font-size: 1rem; font-weight: 800; border: none; cursor: pointer; transition: background .15s; letter-spacing: .5px; }
    .done-btn:hover { background: #2980b9; }
    .done-btn:disabled { background: #1a1a1a; color: #555; cursor: default; }
    .collect-btn { background: #22c55e; color: #000; }
    .collect-btn:hover { background: #16a34a; }

    .sec-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #333; padding: 4px 0 10px; grid-column: 1/-1; border-bottom: 1px solid #1a1a1a; margin-top: 4px; }
    .empty-queue { text-align: center; padding: 80px 20px; color: #333; grid-column: 1/-1; }
    .empty-queue .ei { font-size: 3rem; margin-bottom: 12px; }
  </style>
</head>
<body>
<div id="toast-container"></div>

<header class="stn-header">
  <div class="stn-title">
    <span class="live-dot"></span>
    <h1>🚗 Driver / Dispatch</h1>
    <span class="stn-badge">Delivery Queue</span>
  </div>
  <nav class="stn-nav">
    <a href="cashier.html">🧾 Cashier</a>
    <a href="butcher.html">🔪 Butcher</a>
    <a href="kitchen.html">🔥 Kitchen</a>
    <a href="dispatch.html" class="active">🚗 Driver</a>
  </nav>
  <span class="stn-clock" id="clock"></span>
</header>

<div class="stats-bar">
  <div>
    <div class="stat-num" id="cnt-deliver">0</div>
    <div class="stat-lbl">Deliveries</div>
  </div>
  <div>
    <div class="stat-num" id="cnt-collect" style="color:#3DD68C">0</div>
    <div class="stat-lbl">Ready to Collect</div>
  </div>
</div>

<div class="queue" id="queue">
  <div class="empty-queue"><div class="ei">🚗</div><p>No active deliveries</p></div>
</div>

<script src="js/app.js"></script>
<script type="module">
  import { supabase } from './js/supabase-config.js';

  let _users = [], _products = [], _orders = [];

  function tick() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-ZA', { hour:'2-digit', minute:'2-digit' }); }
  tick(); setInterval(tick, 1000);

  function getUser(o) { return _users.find(u => u.id === o.user_id || u.email === o.user_email) || {}; }
  function getProdName(id) { const p = _products.find(p => String(p.id) === String(id)); return p ? p.name : `#${id}`; }

  async function load() {
    const [ordRes, usrRes, proRes] = await Promise.all([
      supabase.from('orders').select('*').in('status', ['dispatched','delivering','ready']).order('created_at', { ascending: true }),
      supabase.from('users').select('id,name,surname,phone,email'),
      supabase.from('products').select('id,name,unit,stock_qty')
    ]);
    if (!usrRes.error) _users = usrRes.data || [];
    if (!proRes.error) _products = proRes.data || [];
    _orders = ordRes.error ? [] : (ordRes.data || []);
    render(_orders);
  }

  function render(orders) {
    const delivs = orders.filter(o => ['dispatched','delivering'].includes(o.status));
    const collects = orders.filter(o => o.status === 'ready');

    document.getElementById('cnt-deliver').textContent = delivs.length;
    document.getElementById('cnt-collect').textContent = collects.length;

    if (!orders.length) {
      document.getElementById('queue').innerHTML = '<div class="empty-queue"><div class="ei">🚗</div><p>No active deliveries</p></div>';
      return;
    }

    let html = '';
    if (delivs.length) {
      html += `<div class="sec-label">🚗 Deliveries (${delivs.length})</div>`;
      html += delivs.map(o => {
        const u = getUser(o);
        const items = Array.isArray(o.items) ? o.items : [];
        const itemSummary = items.map(i => `${i.quantity||1}× ${getProdName(i.productId||i.product_id)}`).join(', ');
        return `<div class="ocard delivering">
          <div class="ocard-head">
            <div>
              <div class="ocard-id">#${o.id.slice(-6).toUpperCase()}</div>
              <div class="ocard-time">${new Date(o.created_at).toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'})}</div>
            </div>
          </div>
          <div class="ocard-body">
            <div class="ocard-customer">${u.name||''} ${u.surname||''}</div>
            <div class="ocard-phone">📞 ${u.phone||o.user_email||'—'}</div>
            <div class="ocard-address"><strong>Delivery Address</strong>${o.delivery_address||'—'}</div>
            <div class="ocard-total">${formatCurrency(o.total)}</div>
            <div class="ocard-items">${itemSummary}</div>
          </div>
          <button class="done-btn" onclick="markDelivered('${o.id}', this)">✓ DELIVERED</button>
        </div>`;
      }).join('');
    }
    if (collects.length) {
      html += `<div class="sec-label">🏪 Ready for Collection (${collects.length})</div>`;
      html += collects.map(o => {
        const u = getUser(o);
        const items = Array.isArray(o.items) ? o.items : [];
        const itemSummary = items.map(i => `${i.quantity||1}× ${getProdName(i.productId||i.product_id)}`).join(', ');
        return `<div class="ocard ready-collect">
          <div class="ocard-head">
            <div>
              <div class="ocard-id">#${o.id.slice(-6).toUpperCase()}</div>
              <div class="ocard-time">${new Date(o.created_at).toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'})}</div>
            </div>
          </div>
          <div class="ocard-body">
            <div class="ocard-customer">${u.name||''} ${u.surname||''}</div>
            <div class="ocard-phone">📞 ${u.phone||o.user_email||'—'}</div>
            <div class="ocard-address"><strong>Collection — Store</strong>76 Meeu St, East Lynne</div>
            <div class="ocard-total">${formatCurrency(o.total)}</div>
            <div class="ocard-items">${itemSummary}</div>
          </div>
          <button class="done-btn collect-btn" onclick="markCollected('${o.id}', this)">✓ COLLECTED</button>
        </div>`;
      }).join('');
    }

    document.getElementById('queue').innerHTML = html;
  }

  window.markDelivered = async function(id, btn) {
    btn.disabled = true; btn.textContent = 'Updating...';
    const order = (_orders||[]).find(o => o.id === id);
    const { error } = await supabase.from('orders').update({ status: 'delivered', updated_at: new Date().toISOString() }).eq('id', id);
    if (error) { showToast('Error: ' + error.message, 'error'); btn.disabled = false; btn.textContent = '✓ DELIVERED'; return; }
    if (order && Array.isArray(order.items)) await deductStock(order.items);
    await load();
  };

  window.markCollected = async function(id, btn) {
    btn.disabled = true; btn.textContent = 'Updating...';
    const order = (_orders||[]).find(o => o.id === id);
    const { error } = await supabase.from('orders').update({ status: 'collected', updated_at: new Date().toISOString() }).eq('id', id);
    if (error) { showToast('Error: ' + error.message, 'error'); btn.disabled = false; btn.textContent = '✓ COLLECTED'; return; }
    if (order && Array.isArray(order.items)) await deductStock(order.items);
    await load();
  };

  async function deductStock(items) {
    for (const item of items) {
      const pid = item.productId || item.product_id;
      const qty = parseFloat(item.quantity || item.qty || 1);
      if (!pid || !qty) continue;
      const prod = _products.find(p => String(p.id) === String(pid));
      if (!prod) continue;
      const current = parseFloat(prod.stock_qty ?? 0);
      const updated = Math.max(0, current - qty);
      prod.stock_qty = updated;
      await supabase.from('products').update({ stock_qty: updated }).eq('id', pid);
    }
  }

  load();
  setInterval(load, 15000);
</script>
</body>
</html>
