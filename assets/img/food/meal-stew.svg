<path d="M100 65 C98 58 100 51 98 44" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
<path d="M120 68 C118 61 120 54 118 47" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
<rect x="58" y="16" width="84" height="22" rx="11" fill="#5a2a08" opacity=".9"/>
<text x="100" y="31" font-family="Arial" font-size="11" font-weight="700" fill="#f5d08a" text-anchor="middle">PAP &amp; BEEF STEW</text>
