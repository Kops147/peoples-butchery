<ellipse cx="82" cy="98" rx="12" ry="9" fill="#7a3a10"/>
<ellipse cx="81" cy="97" rx="9" ry="7" fill="#9e5020"/>
<!-- mutton chunk 2 -->
<ellipse cx="115" cy="102" rx="10" ry="8" fill="#7a3a10"/>
<ellipse cx="114" cy="101" rx="7.5" ry="6" fill="#9e5020"/>
<!-- potato chunk -->
<ellipse cx="100" cy="96" rx="8" ry="6" fill="#d4aa60" opacity=".9"/>
<!-- dhania (coriander) dots -->
<circle cx="88" cy="94" r="3" fill="#2a8a30"/>
<circle cx="104" cy="92" r="2.5" fill="#2a8a30"/>
<circle cx="96" cy="90" r="2" fill="#3aa040"/>
<!-- bowl rim -->
