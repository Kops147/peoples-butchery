<ellipse cx="55" cy="125" rx="6" ry="16" fill="#fff" opacity=".08" transform="rotate(-15 55 125)"/>
<!-- steam -->
<path d="M80 68 C78 61 80 54 78 47" fill="none" stroke="#c88020" stroke-width="2.5" stroke-linecap="round"/>
<path d="M100 65 C98 58 100 51 98 44" fill="none" stroke="#c88020" stroke-width="2.5" stroke-linecap="round"/>
<path d="M120 68 C118 61 120 54 118 47" fill="none" stroke="#c88020" stroke-width="2.5" stroke-linecap="round"/>
<!-- label badge -->
<rect x="62" y="16" width="76" height="22" rx="11" fill="#c06010" opacity=".9"/>
<text x="100" y="31" font-family="Arial" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">MUTTON CURRY</text>
</svg>
