<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#eeeeee"/>
      <stop offset="30%" stop-color="#aaaaaa"/>
      <stop offset="60%" stop-color="#dddddd"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6b3a1f"/>
      <stop offset="50%" stop-color="#8b5a35"/>
      <stop offset="100%" stop-color="#4a2810"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="redglow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#aa0000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- ─── CLEAVERS ─────────────────────────── -->
  <g filter="url(#drop)">

    <!-- Left cleaver: handle lower-left, blade upper-right -->
    <g transform="translate(44,50) rotate(-40)">
      <path d="M-11,2 L11,2 L9,-44 L-9,-44 Z" fill="url(#steel)" stroke="#606060" stroke-width="0.5"/>
      <rect x="-9" y="-44" width="18" height="5" rx="1" fill="#e8e8e8" opacity="0.85"/>
      <path d="M9,2 L11,2 L9,-44 Z" fill="#888" opacity="0.35"/>
      <rect x="-6" y="2" width="12" height="19" rx="3" fill="url(#wood)" stroke="#2a1500" stroke-width="0.5"/>
      <circle cx="0" cy="8"  r="1.7" fill="#c8a050" stroke="#9a7030" stroke-width="0.3"/>
      <circle cx="0" cy="15" r="1.7" fill="#c8a050" stroke="#9a7030" stroke-width="0.3"/>
    </g>

    <!-- Right cleaver: mirrored -->
    <g transform="translate(44,50) rotate(40) scale(-1,1)">
      <path d="M-11,2 L11,2 L9,-44 L-9,-44 Z" fill="url(#steel)" stroke="#606060" stroke-width="0.5"/>
      <rect x="-9" y="-44" width="18" height="5" rx="1" fill="#e8e8e8" opacity="0.85"/>
      <path d="M9,2 L11,2 L9,-44 Z" fill="#888" opacity="0.35"/>
      <rect x="-6" y="2" width="12" height="19" rx="3" fill="url(#wood)" stroke="#2a1500" stroke-width="0.5"/>
      <circle cx="0" cy="8"  r="1.7" fill="#c8a050" stroke="#9a7030" stroke-width="0.3"/>
      <circle cx="0" cy="15" r="1.7" fill="#c8a050" stroke="#9a7030" stroke-width="0.3"/>
    </g>

    <!-- ─── COW HEAD ───────────────────────── -->
    <!-- Neck base -->
    <path d="M30,72 Q44,78 58,72 L60,62 Q44,68 28,62 Z" fill="#1a1a1a"/>
    <!-- Head -->
    <ellipse cx="44" cy="36" rx="22" ry="22" fill="#1a1a1a"/>
    <!-- Left ear -->
    <path d="M23,28 Q14,20 17,11 Q24,17 26,27 Z" fill="#1a1a1a"/>
    <path d="M23,27 Q15,21 18,13 Q23,18 25,26 Z" fill="#c09090" opacity="0.6"/>
    <!-- Right ear -->
    <path d="M65,28 Q74,20 71,11 Q64,17 62,27 Z" fill="#1a1a1a"/>
    <path d="M65,27 Q73,21 70,13 Q65,18 63,26 Z" fill="#c09090" opacity="0.6"/>
    <!-- Left horn -->
    <path d="M26,19 Q13,9 18,1" stroke="#d4c08a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Right horn -->
    <path d="M62,19 Q75,9 70,1" stroke="#d4c08a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- White face blaze -->
    <ellipse cx="44" cy="35" rx="13" ry="16" fill="#f2f2f2"/>
    <!-- Left eye patch -->
    <ellipse cx="35" cy="28" rx="6" ry="6.5" fill="#1a1a1a"/>
    <!-- Right eye patch -->
    <ellipse cx="53" cy="28" rx="6" ry="6.5" fill="#1a1a1a"/>
    <!-- Eyes -->
    <ellipse cx="35" cy="27" rx="3" ry="3" fill="#f0f0f0"/>
    <ellipse cx="53" cy="27" rx="3" ry="3" fill="#f0f0f0"/>
    <!-- Pupils -->
    <circle cx="35.5" cy="27.5" r="1.6" fill="#0d0d0d"/>
    <circle cx="53.5" cy="27.5" r="1.6" fill="#0d0d0d"/>
    <!-- Eye shine -->
    <circle cx="34.7" cy="26.5" r="0.6" fill="#ffffff"/>
    <circle cx="52.7" cy="26.5" r="0.6" fill="#ffffff"/>
    <!-- Forehead patch -->
    <path d="M34,18 Q44,12 54,18 Q50,26 44,24 Q38,26 34,18Z" fill="#1a1a1a"/>
    <!-- Snout -->
    <ellipse cx="44" cy="47" rx="11" ry="8.5" fill="#e8b8a8"/>
    <ellipse cx="44" cy="48" rx="9" ry="6.5" fill="#d0a090" opacity="0.5"/>
    <!-- Nostrils -->
    <ellipse cx="39.5" cy="48" rx="2.4" ry="1.7" transform="rotate(-12,39.5,48)" fill="#a06050"/>
    <ellipse cx="48.5" cy="48" rx="2.4" ry="1.7" transform="rotate( 12,48.5,48)" fill="#a06050"/>
  </g>

  <!-- ─── BRAND TEXT ─────────────────────── -->
  <!-- "The" -->
  <text x="100" y="27" font-family="Georgia,'Times New Roman',serif" font-size="16" font-style="italic" font-weight="bold" fill="#cc1a00" filter="url(#redglow)">The</text>
  <!-- "People's" -->
  <text x="97" y="57" font-family="Georgia,'Times New Roman',serif" font-size="29" font-style="italic" font-weight="bold" fill="#cc1a00">People's</text>
  <!-- "Butchery" -->
  <text x="97" y="83" font-family="Georgia,'Times New Roman',serif" font-size="25" font-style="italic" font-weight="bold" fill="#e8e8e8">Butchery</text>
  <!-- Underline -->
  <line x1="97" y1="87" x2="278" y2="87" stroke="#cc1a00" stroke-width="1.5" stroke-linecap="round"/>
</svg>