<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Dashboard — The Peoples Butchery</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #0A0A0A; color: #E0E0E0; }
    .ticket-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 20px; }
    .ticket-card { background: #141414; border: 1px solid #222; border-radius: 12px; padding: 20px; position: relative; overflow: hidden; }
    .ticket-card.priority-high { border-left: 4px solid #ff4d4d; }
    .ticket-card.priority-normal { border-left: 4px solid #3DD68C; }
    .ticket-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
    .order-num { font-family: var(--font-head); font-weight: 800; font-size: 1.2rem; color: #3DD68C; }
    .sla-timer { font-size: 0.85rem; color: #888; display: flex; align-items: center; gap: 5px; }
    .sla-critical { color: #ff4d4d; font-weight: 700; animation: blink 1s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .item-list { list-style: none; padding: 0; margin-bottom: 20px; }
    .item-list li { padding: 8px 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
    .item-qty { font-weight: 700; color: #3DD68C; margin-right: 10px; }
    .btn-group { display: flex; gap: 10px; }
    .badge-dept { background: #1A1A1A; color: #888; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  
  <header style="padding: 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: baseline; gap: 15px;">
      <h1 style="font-size: 1.5rem; margin: 0;">Kitchen Dashboard</h1>
      <span class="badge-dept">Live Feed — Station 1</span>
    </div>
    <div class="sponsor-brand" style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 0.6rem; color: #666; letter-spacing: 1px;">POWERED BY</span>
      <svg width="120" height="34" viewBox="0 0 160 44">
        <rect width="160" height="44" rx="6" fill="#000"/>
        <text x="12" y="28" font-family="Arial" font-size="20" font-weight="800" fill="#3DD68C">yType</text>
        <path d="M85 8 L80 25 L88 25 L83 38 L95 20 L87 20 Z" fill="#3DD68C" />
      </svg>
    </div>
  </header>

  <main class="ticket-grid" id="ticket-container">
    <!-- Tickets will be injected here -->
    <div style="grid-column: 1/-1; text-align: center; padding: 100px; color: #444;">
      <div style="font-size: 3rem; margin-bottom: 20px;">🍳</div>
      <h3>No orders in the kitchen yet.</h3>
      <p>New cooked meals will appear here automatically.</p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const DEPT = 'kitchen';
    
    async function fetchTickets() {
      try {
        const res = await fetch(`${API_BASE_URL}/tickets?department=${DEPT}`);
        const tickets = await res.json();
        renderTickets(Array.isArray(tickets) ? tickets : []);
      } catch (err) {
        console.error('Failed to fetch tickets:', err);
        document.getElementById('ticket-container').innerHTML = '<p style="color:#aaa;text-align:center;padding:20px">Could not connect to server</p>';
      }
    }

    function renderTickets(tickets) {
      const container = document.getElementById('ticket-container');
      if (tickets.length === 0) return;
      
      container.innerHTML = tickets.map(t => `
        <div class="ticket-card priority-${t.priority}">
          <div class="ticket-header">
            <div>
              <div class="order-num">#${t.order_number.slice(-6)}</div>
              <div style="font-size: 0.75rem; color: #666;">ID: ${t.id}</div>
            </div>
            <div class="sla-timer" id="timer-${t.id}">
              ⏱️ ${formatSLA(t.sla_deadline)}
            </div>
          </div>
          <ul class="item-list">
            ${(t.items || []).map(item => `
              <li>
                <span><span class="item-qty">${item.qty}x</span> ${item.name}</span>
              </li>
            `).join('')}
          </ul>
          <div class="btn-group">
            ${t.status === 'open' 
              ? `<button class="btn btn-primary btn-full" onclick="updateTicket('${t.id}', 'processing')">Start Prep</button>`
              : `<button class="btn btn-success btn-full" onclick="updateTicket('${t.id}', 'done')">Mark Ready</button>`
            }
          </div>
        </div>
      `).join('');
    }

    function formatSLA(deadline) {
      const remaining = new Date(deadline) - new Date();
      if (remaining < 0) return '<span class="sla-critical">LATE</span>';
      const mins = Math.floor(remaining / 60000);
      const secs = Math.floor((remaining % 60000) / 1000);
      return `${mins}m ${secs}s`;
    }

    async function updateTicket(id, status) {
      try {
        await fetch(`${API_BASE_URL}/tickets/${id}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        showToast(`Ticket marked as ${status}`, 'success');
      } catch (err) {
        showToast('Failed to update ticket', 'error');
      }
      setTimeout(fetchTickets, 500);
    }

    setInterval(fetchTickets, 5000);
    fetchTickets();
  </script>
</body>
</html>
