<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Dashboard — The Peoples Butchery</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #0A0A0A; color: #E0E0E0; min-height: 100vh; margin: 0; overflow-x: hidden; }

    /* Ambient animated background */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 60% at 20% 30%, rgba(61,214,140,0.04) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 50% at 80% 70%, rgba(240,160,0,0.03) 0%, transparent 60%);
      animation: ambientShift 12s ease-in-out infinite alternate;
    }
    @keyframes ambientShift {
      0%   { opacity: .6; transform: scale(1) translateY(0); }
      50%  { opacity: 1;  transform: scale(1.05) translateY(-10px); }
      100% { opacity: .7; transform: scale(1) translateY(5px); }
    }

    .stn-header { background: rgba(17,17,17,0.97); border-bottom: 2px solid #1a1a1a; padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; gap: 16px; backdrop-filter: blur(8px); }
    .stn-title { display: flex; align-items: center; gap: 12px; }
    .stn-logo { height: 40px; width: auto; filter: drop-shadow(0 0 8px rgba(61,214,140,0.3)); animation: logoGlow 3s ease-in-out infinite alternate; }
    @keyframes logoGlow { 0% { filter: drop-shadow(0 0 4px rgba(61,214,140,0.2)); } 100% { filter: drop-shadow(0 0 12px rgba(61,214,140,0.5)); } }
    .stn-title h1 { font-family: var(--font-head); font-size: 1.25rem; margin: 0; color: #fff; }
    .stn-badge { background: rgba(61,214,140,0.12); border: 1px solid rgba(61,214,140,0.3); color: #3DD68C; padding: 3px 10px; border-radius: 20px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
    .stn-nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .stn-nav a { color: #555; text-decoration: none; font-size: 0.73rem; padding: 5px 10px; border: 1px solid #222; border-radius: 6px; transition: all .2s; white-space: nowrap; }
    .stn-nav a:hover { color: #aaa; border-color: #444; }
    .stn-nav a.active { color: #3DD68C; border-color: rgba(61,214,140,0.4); background: rgba(61,214,140,0.05); }
    .stn-clock { font-size: 0.8rem; color: #444; white-space: nowrap; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #3DD68C; display: inline-block; margin-right: 4px; animation: livepulse 2s infinite; }
    @keyframes livepulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.8)} }

    /* Stats bar with entry animation */
    .stats-bar { background: rgba(13,13,13,0.95); border-bottom: 1px solid #1a1a1a; padding: 12px 24px; display: flex; gap: 28px; align-items: center; flex-wrap: wrap; position: relative; z-index: 10; }
    .stat-chip { display: flex; align-items: center; gap: 8px; animation: statEntry .5s ease both; }
    .stat-chip:nth-child(1) { animation-delay: .1s; }
    .stat-chip:nth-child(3) { animation-delay: .2s; }
    .stat-chip:nth-child(5) { animation-delay: .3s; }
    .stat-chip:nth-child(7) { animation-delay: .4s; }
    @keyframes statEntry { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform: translateY(0); } }
    .stat-num { font-family: var(--font-head); font-weight: 800; font-size: 1.3rem; transition: all .4s; }
    .stat-num.bump { transform: scale(1.35); }
    .stat-lbl { font-size: 0.73rem; color: #555; }
    .stat-divider { width: 1px; height: 28px; background: #1e1e1e; }

    /* Queue grid */
    .queue-wrap { padding: 20px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; align-content: start; position: relative; z-index: 1; }
    .sec-label { grid-column: 1/-1; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #3a3a3a; padding-bottom: 8px; border-bottom: 1px solid #1a1a1a; margin-top: 8px; }
    .sec-label:first-child { margin-top: 0; }

    /* Card entrance + hover */
    .ocard { background: #141414; border: 1px solid #202020; border-radius: 12px; overflow: hidden; transition: transform .15s, box-shadow .2s; animation: cardIn .35s ease both; }
    @keyframes cardIn { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform: translateY(0); } }
    .ocard:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
    .ocard.urgent { border-left: 4px solid #ff4d4d; animation: cardIn .35s ease both, urgentGlow 1.8s ease-in-out infinite; }
    .ocard.inprog  { border-left: 4px solid #f0a000; }
    .ocard.ready   { border-left: 4px solid #3DD68C; }
    .ocard.neworder{ border-left: 4px solid #3498db; animation: cardIn .35s ease both, newFlash .6s ease-out 1; }
    @keyframes urgentGlow {
      0%,100% { box-shadow: 0 0 0px rgba(255,77,77,0); }
      50%      { box-shadow: 0 0 18px rgba(255,77,77,0.25), inset 0 0 8px rgba(255,77,77,0.05); }
    }
    @keyframes newFlash {
      0%   { background: rgba(52,152,219,0.18); }
      100% { background: #141414; }
    }

    .ocard-head { padding: 14px 16px 8px; display: flex; justify-content: space-between; align-items: flex-start; }
    .ocard-num { font-family: var(--font-head); font-weight: 800; font-size: 1.05rem; }
    .urgent .ocard-num { color: #ff4d4d; }
    .inprog .ocard-num  { color: #f0a000; }
    .ready  .ocard-num  { color: #3DD68C; }
    .neworder .ocard-num{ color: #3498db; }

    .pbadge { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; padding: 3px 8px; border-radius: 4px; }
    .urgent .pbadge { background: rgba(255,77,77,.15); color: #ff4d4d; }
    .inprog .pbadge  { background: rgba(240,160,0,.15); color: #f0a000; }
    .ready  .pbadge  { background: rgba(61,214,140,.15); color: #3DD68C; }
    .neworder .pbadge{ background: rgba(52,152,219,.15); color: #3498db; }

    .ocard-meta { padding: 0 16px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .tag { font-size: 0.68rem; padding: 2px 7px; border-radius: 4px; border: 1px solid; }
    .tag-delivery { color: #3498db; border-color: rgba(52,152,219,.3); background: rgba(52,152,219,.08); }
    .tag-collect  { color: #e8a020; border-color: rgba(232,160,32,.3); background: rgba(232,160,32,.08); }
    .tag-timer { color: #666; border-color: #222; background: transparent; }
    .tag-timer.late { color: #ff4d4d; border-color: rgba(255,77,77,.3); animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

    .ocard-customer { padding: 0 16px 10px; font-size: 0.8rem; color: #666; }
    .ilist { list-style: none; padding: 0; margin: 0; border-top: 1px solid #1a1a1a; }
    .ilist li { padding: 8px 16px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .ilist li:last-child { border-bottom: none; }
    .iqty { font-weight: 700; font-size: 0.75rem; background: #1e1e1e; padding: 2px 7px; border-radius: 4px; margin-right: 8px; }
    .urgent .iqty { color: #ff4d4d; }
    .inprog .iqty  { color: #f0a000; }
    .ready  .iqty  { color: #3DD68C; }
    .neworder .iqty{ color: #3498db; }

    .ocard-foot { padding: 12px 16px; }
    .empty-state { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: #2a2a2a; }
    .empty-state .ei { font-size: 3.5rem; margin-bottom: 16px; }
    .empty-state h3 { color: #333; margin-bottom: 8px; }
    .empty-state p  { color: #2a2a2a; font-size: .85rem; }

    .btn-start  { background: #1a3a2a; color: #3DD68C; border: 1px solid rgba(61,214,140,.3); border-radius: 8px; padding: 10px 16px; font-weight: 700; font-size: .85rem; cursor: pointer; width: 100%; transition: background .2s; }
    .btn-start:hover { background: #1f4a35; }
    .btn-ready  { background: rgba(61,214,140,.12); color: #3DD68C; border: 1px solid rgba(61,214,140,.4); border-radius: 8px; padding: 10px 16px; font-weight: 700; font-size: .85rem; cursor: pointer; width: 100%; transition: background .2s; }
    .btn-ready:hover { background: rgba(61,214,140,.2); }
    .btn-dispatch { background: rgba(52,152,219,.12); color: #3498db; border: 1px solid rgba(52,152,219,.4); border-radius: 8px; padding: 10px 16px; font-weight: 700; font-size: .85rem; cursor: pointer; width: 100%; transition: background .2s; }
    .btn-dispatch:hover { background: rgba(52,152,219,.2); }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <header class="stn-header">
    <div class="stn-title">
      <img src="assets/img/logo-navbar.png" alt="The Peoples Butchery" class="stn-logo" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
      <span style="font-size:1.4rem;display:none">🍳</span>
      <h1>Kitchen Dashboard</h1>
      <span class="stn-badge">Prep &amp; Packaging</span>
    </div>
    <nav class="stn-nav">
      <a href="cashier.html">💰 Cashier</a>
      <a href="kitchen.html" class="active">🍳 Kitchen</a>
      <a href="butcher.html">🥩 Butcher</a>
      <a href="dispatch.html">🚚 Dispatch</a>
      <a href="admin.html">⚙️ Admin</a>
    </nav>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="live-dot"></span>
      <span class="stn-clock" id="clock">—</span>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-chip">
      <span class="stat-num" style="color:#ff4d4d" id="s-pending">—</span>
      <span class="stat-lbl">Waiting</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-chip">
      <span class="stat-num" style="color:#f0a000" id="s-inprog">—</span>
      <span class="stat-lbl">In Progress</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-chip">
      <span class="stat-num" style="color:#3DD68C" id="s-done">—</span>
      <span class="stat-lbl">Done Today</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-chip">
      <span class="stat-num" style="color:#3498db" id="s-delivery">—</span>
      <span class="stat-lbl">For Delivery</span>
    </div>
    <div style="margin-left:auto;font-size:.72rem;color:#3a3a3a" id="refresh-lbl">Loading...</div>
  </div>

  <main class="queue-wrap" id="queue-wrap"></main>

  <script src="js/app.js"></script>
  <script>
    // Clock
    function tick() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
    setInterval(tick, 1000); tick();

    // Firebase cache
    let _fb = null;
    async function fb() {
      if (_fb) return _fb;
      const [cfg, fs] = await Promise.all([
        import('./js/firebase-config.js'),
        import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js')
      ]);
      _fb = { db: cfg.db, ...fs };
      return _fb;
    }

    function toDate(v) { return v?.toDate ? v.toDate() : v ? new Date(v) : null; }
    function minsAgo(d) { return d ? Math.floor((Date.now() - d.getTime()) / 60000) : 0; }
    function fmtWait(d) {
      if (!d) return '';
      const m = minsAgo(d);
      if (m < 1) return 'Just now';
      if (m === 1) return '1 min ago';
      return m + ' mins ago';
    }

    async function load() {
      try {
        const { db, collection, getDocs, query, where } = await fb();
        const snap = await getDocs(query(collection(db, 'orders'), where('status', 'in', ['pending','braai','packaging'])));
        const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (toDate(a.createdAt)||0) - (toDate(b.createdAt)||0));

        // Stats with bump animation
        function setStat(id, val) {
          const el = document.getElementById(id);
          const prev = el.textContent;
          el.textContent = val;
          if (prev !== '—' && prev !== String(val)) {
            el.classList.remove('bump');
            void el.offsetWidth;
            el.classList.add('bump');
            setTimeout(() => el.classList.remove('bump'), 400);
          }
        }
        setStat('s-pending', orders.filter(o => o.status === 'pending').length);
        setStat('s-inprog', orders.filter(o => o.status === 'braai').length);
        setStat('s-delivery', orders.filter(o => o.deliveryMethod === 'delivery').length);

        // Done today
        const doneSnap = await getDocs(query(collection(db, 'orders'), where('status', 'in', ['dispatched','delivered','collected'])));
        setStat('s-done', doneSnap.size);

        renderQueue(orders);
        document.getElementById('refresh-lbl').textContent = '↻ Updated ' + new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
      } catch (e) {
        document.getElementById('refresh-lbl').textContent = '⚠ ' + e.message;
      }
    }

    function renderQueue(orders) {
      const w = document.getElementById('queue-wrap');
      if (!orders.length) {
        w.innerHTML = `<div class="empty-state"><div class="ei">🍳</div><h3>All clear — kitchen is empty.</h3><p>New orders appear here automatically every 30 seconds.</p></div>`;
        return;
      }

      const sections = [
        { key: 'urgent', label: '🔴 URGENT — Waiting over 20 mins', cls: 'urgent', badge: '⚡ URGENT',
          filter: o => o.status === 'pending' && minsAgo(toDate(o.createdAt)) >= 20 },
        { key: 'inprog', label: '🟡 IN PROGRESS — Being Prepped', cls: 'inprog', badge: '🔪 PREPPING',
          filter: o => o.status === 'braai' },
        { key: 'packaging', label: '🟢 PACKAGING — Almost Ready', cls: 'ready', badge: '📦 PACKAGING',
          filter: o => o.status === 'packaging' },
        { key: 'new', label: '🔵 NEW — Just Received', cls: 'neworder', badge: '🆕 NEW',
          filter: o => o.status === 'pending' && minsAgo(toDate(o.createdAt)) < 20 },
      ];

      let html = '';
      for (const sec of sections) {
        const group = orders.filter(sec.filter);
        if (!group.length) continue;
        html += `<div class="sec-label">${sec.label}</div>`;
        for (const o of group) {
          const created = toDate(o.createdAt);
          const mins = minsAgo(created);
          const late = mins > 30;
          const isDelivery = o.deliveryMethod === 'delivery';

          const items = (o.items || []).map(it =>
            `<li><span><span class="iqty">${it.qty}${it.unit && it.unit !== 'each' ? it.unit : '×'}</span>${it.name}</span><span style="color:#555;font-size:.78rem">R${((it.price||0)*(it.qty||1)).toFixed(2)}</span></li>`
          ).join('');

          const actionBtn = o.status === 'pending'
            ? `<button class="btn-start" onclick="setStatus('${o.id}','braai')">🔪 Start Prepping</button>`
            : o.status === 'braai'
            ? `<button class="btn-ready" onclick="setStatus('${o.id}','packaging')">✅ Mark Ready</button>`
            : `<button class="btn-dispatch" onclick="setStatus('${o.id}','dispatched')">🚚 Send to Dispatch</button>`;

          const cardDelay = (html.match(/ocard/g)||[]).length * 0.06;
          html += `
          <div class="ocard ${sec.cls}" style="animation-delay:${cardDelay}s">
            <div class="ocard-head">
              <div>
                <div class="ocard-num">#${o.id.slice(-5).toUpperCase()}</div>
                <div style="margin-top:4px;font-size:.8rem;color:#555">R${parseFloat(o.total||0).toFixed(2)}</div>
              </div>
              <span class="pbadge">${sec.badge}</span>
            </div>
            <div class="ocard-meta">
              <span class="tag ${isDelivery?'tag-delivery':'tag-collect'}">${isDelivery?'🚴 Delivery':'🏪 Collect'}</span>
              <span class="tag tag-timer ${late?'late':''}">⏱ ${fmtWait(created)}${late?' — LATE':''}</span>
            </div>
            <div class="ocard-customer">👤 ${o.userName||o.userEmail||'Walk-in'}${o.deliveryAddress ? ' · ' + o.deliveryAddress.split(',')[0] : ''}</div>
            <ul class="ilist">${items}</ul>
            <div class="ocard-foot">${actionBtn}</div>
          </div>`;
        }
      }
      w.innerHTML = html;
    }

    async function setStatus(id, status) {
      try {
        const { db, doc, updateDoc, serverTimestamp } = await fb();
        await updateDoc(doc(db, 'orders', id), { status, updatedAt: serverTimestamp() });
        const msgs = { braai: '🔪 Prepping started', packaging: '✅ Order marked ready', dispatched: '🚚 Sent to dispatch' };
        showToast(msgs[status] || 'Updated', 'success');
        await load();
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
