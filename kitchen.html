<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Station - The Peoples Butchery</title>
<link rel="stylesheet" href="css/style.css">
<style>
@keyframes breathe {
  0%,100% { background-position: 0% 50%; }
  50%      { background-position: 100% 50%; }
}
body {
  background: #0A0A0A;
  background-image: radial-gradient(ellipse at 20% 50%, rgba(249,115,22,.06) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 50%, rgba(61,214,140,.04) 0%, transparent 60%);
  background-size: 200% 200%;
  animation: breathe 8s ease-in-out infinite;
  color: #E0E0E0; min-height: 100vh; margin: 0;
  font-family: var(--font-body, sans-serif);
}
@keyframes logoGlow {
  0%,100% { filter: drop-shadow(0 0 6px rgba(61,214,140,.6)); }
  50%      { filter: drop-shadow(0 0 14px rgba(61,214,140,1)); }
}
.stn-header {
  background: rgba(10,10,10,.92); backdrop-filter: blur(8px);
  border-bottom: 2px solid #1a1a1a; padding: 12px 20px;
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 100; gap: 12px; flex-wrap: wrap;
}
.stn-title { display: flex; align-items: center; gap: 10px; }
.stn-logo { height: 34px; width: auto; animation: logoGlow 3s ease-in-out infinite; }
.stn-title h1 { font-family: var(--font-head, sans-serif); font-size: 1.1rem; margin: 0; color: #fff; }
.stn-badge {
  background: rgba(249,115,22,.12); border: 1px solid rgba(249,115,22,.3); color: #f97316;
  padding: 3px 10px; border-radius: 20px; font-size: .68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
}
.live-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #f97316;
  display: inline-block; margin-right: 4px; animation: livepulse 2s infinite;
}
@keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.stn-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.stn-nav a {
  color: #555; text-decoration: none; font-size: .73rem;
  padding: 5px 10px; border: 1px solid #222; border-radius: 6px; transition: all .2s;
}
.stn-nav a:hover { color: #aaa; border-color: #444; }
.stn-nav a.active { color: #f97316; border-color: rgba(249,115,22,.4); background: rgba(249,115,22,.05); }
.stn-clock { font-size: .8rem; color: #444; }
@keyframes statBump {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.25); color: #fff; }
  100% { transform: scale(1); }
}
.stats-bar {
  background: rgba(13,13,13,.8); border-bottom: 1px solid #1a1a1a;
  padding: 10px 20px; display: flex; gap: 24px; align-items: center;
}
.stat-num {
  font-family: var(--font-head, sans-serif); font-weight: 800; font-size: 1.6rem;
  color: #f97316; display: inline-block; transition: color .3s;
}
.stat-num.bump { animation: statBump .4s ease-out forwards; }
.stat-lbl { font-size: .72rem; color: #555; }
.queue {
  padding: 16px; display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px; align-content: start;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0); }
}
.ocard {
  background: #141414; border: 1px solid #1e1e1e;
  border-left: 4px solid #f97316; border-radius: 12px;
  overflow: hidden; opacity: 0; animation: slideUp .45s ease-out forwards;
}
@keyframes urgentPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); border-left-color: #ef4444; }
  50%     { box-shadow: 0 0 16px 4px rgba(239,68,68,.45); border-left-color: #ff6b6b; }
}
.ocard.urgent { animation: slideUp .45s ease-out forwards, urgentPulse 2s ease-in-out 0.5s infinite; }
@keyframes newFlash {
  0%   { background: rgba(59,130,246,.18); border-left-color: #3b82f6; }
  60%  { background: rgba(59,130,246,.04); border-left-color: #3b82f6; }
  100% { background: #141414; border-left-color: #f97316; }
}
.ocard.new-order { animation: slideUp .45s ease-out forwards, newFlash 2.5s ease-out 0.5s forwards; }
.ocard-head { padding: 14px 16px 6px; display: flex; justify-content: space-between; align-items: flex-start; }
.ocard-id { font-family: var(--font-head, sans-serif); font-weight: 900; font-size: 1.3rem; color: #f97316; }
.ocard-time { font-size: .75rem; color: #444; margin-top: 2px; }
.wait-badge {
  font-size: .72rem; color: #f0a000; font-weight: 700;
  background: rgba(240,160,0,.1); border-radius: 4px; padding: 2px 6px;
}
.ocard-body { padding: 4px 16px 12px; }
.ocard-customer { font-size: 1rem; font-weight: 700; color: #ccc; margin-bottom: 10px; }
.task-list { display: flex; flex-direction: column; gap: 8px; }
.task-item { background: #1a1a1a; border-radius: 8px; padding: 12px 14px; }
.task-name { font-size: 1rem; font-weight: 700; color: #ddd; margin-bottom: 6px; }
.task-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag-braai { background: rgba(249,115,22,.2); color: #f97316; font-size: .8rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.tag-pap   { background: rgba(61,214,140,.15); color: #3DD68C; font-size: .8rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.tag-qty   { background: rgba(232,160,32,.12); color: #e8a020; font-size: .8rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.pap-total {
  margin: 10px 16px 0; background: rgba(61,214,140,.08);
  border: 1px solid rgba(61,214,140,.2); border-radius: 8px;
  padding: 10px 14px; font-size: .9rem; color: #3DD68C; font-weight: 700;
}
.done-btn {
  display: block; margin: 12px 16px 16px; width: calc(100% - 32px);
  padding: 14px; border-radius: 10px; background: #f97316; color: #000;
  font-size: 1rem; font-weight: 800; border: none; cursor: pointer;
  transition: background .15s; letter-spacing: .5px;
}
.done-btn:hover { background: #ea6c10; }
.done-btn:disabled { background: #1a1a1a; color: #555; cursor: default; }
.empty-queue { text-align: center; padding: 80px 20px; color: #333; grid-column: 1/-1; }
.empty-queue .ei { font-size: 3rem; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="toast-container"></div>

<header class="stn-header">
  <div class="stn-title">
    <span class="live-dot"></span>
    <img src="assets/logo-cow.svg" alt="The Peoples Butchery" class="stn-logo">
    <h1>&#x1F525; Kitchen Station</h1>
    <span class="stn-badge">Braai Queue</span>
  </div>
  <nav class="stn-nav">
    <a href="cashier.html">&#x1F9FE; Cashier</a>
    <a href="butcher.html">&#x1F52A; Butcher</a>
    <a href="kitchen.html" class="active">&#x1F525; Kitchen</a>
    <a href="dispatch.html">&#x1F697; Driver</a>
  </nav>
  <span class="stn-clock" id="clock"></span>
</header>

<div class="stats-bar">
  <div>
    <div class="stat-num" id="cnt">0</div>
    <div class="stat-lbl">Braai Orders</div>
  </div>
  <div>
    <div class="stat-num" id="pap-cnt" style="color:#3DD68C">0</div>
    <div class="stat-lbl">Pap Portions</div>
  </div>
</div>

<div class="queue" id="queue">
  <div class="empty-queue"><div class="ei">&#x1F525;</div><p>No braai orders &mdash; fire's ready!</p></div>
</div>

<script src="js/app.js"></script>
<script type="module">
import { supabase } from './js/supabase-config.js';

let _products = [];
let _prevIds = new Set();
let _prevCounts = { cnt: 0, pap: 0 };

function tick() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-ZA', { hour:'2-digit', minute:'2-digit' }); }
tick(); setInterval(tick, 1000);

function bumpStat(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  el.addEventListener('animationend', () => el.classList.remove('bump'), { once: true });
}

function getProdName(id) {
  const p = _products.find(p => String(p.id) === String(id));
  return p ? p.name : 'Product #' + id;
}
function waitLabel(ts) {
  const mins = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return mins + 'm ago';
  return Math.floor(mins/60) + 'h ' + (mins%60) + 'm';
}
function isUrgent(ts) {
  return Math.floor((Date.now() - new Date(ts)) / 60000) > 20;
}

async function load() {
  const [ordRes, proRes] = await Promise.all([
    supabase.from('orders').select('*').eq('status', 'braai').order('created_at', { ascending: true }),
    supabase.from('products').select('id,name,unit')
  ]);
  if (!proRes.error) _products = proRes.data || [];
  render(ordRes.error ? [] : (ordRes.data || []));
}

function render(orders) {
  const newCnt = orders.length;
  const newPap = orders.reduce((s, o) => s + (Array.isArray(o.items) ? o.items.reduce((ps, i) => ps + (i.pap || 0), 0) : 0), 0);

  const cntEl = document.getElementById('cnt');
  const papEl = document.getElementById('pap-cnt');
  if (cntEl && newCnt !== _prevCounts.cnt) { cntEl.textContent = newCnt; bumpStat('cnt'); }
  if (papEl && newPap !== _prevCounts.pap) { papEl.textContent = newPap; bumpStat('pap-cnt'); }
  _prevCounts = { cnt: newCnt, pap: newPap };

  if (!orders.length) {
    _prevIds = new Set();
    document.getElementById('queue').innerHTML = '<div class="empty-queue"><div class="ei">&#x1F525;</div><p>No braai orders &mdash; fire\'s ready!</p></div>';
    return;
  }

  const currentIds = new Set(orders.map(o => o.id));

  document.getElementById('queue').innerHTML = orders.map(function(o, idx) {
    const items = Array.isArray(o.items) ? o.items : [];
    const totalOrderPap = items.reduce((s, i) => s + (i.pap || 0), 0);
    const isNew = !_prevIds.has(o.id);
    const urgent = !isNew && isUrgent(o.created_at);
    const cardClass = isNew ? 'ocard new-order' : (urgent ? 'ocard urgent' : 'ocard');
    const delay = idx * 80;

    return '<div class="' + cardClass + '" style="animation-delay:' + delay + 'ms">' +
      '<div class="ocard-head">' +
        '<div>' +
          '<div class="ocard-id">#' + o.id.slice(-6).toUpperCase() + '</div>' +
          '<div class="ocard-time">' + new Date(o.created_at).toLocaleTimeString('en-ZA', { hour:'2-digit', minute:'2-digit' }) + '</div>' +
        '</div>' +
        '<span class="wait-badge">&#x23F1; ' + waitLabel(o.created_at) + '</span>' +
      '</div>' +
      '<div class="ocard-body">' +
        '<div class="ocard-customer">' + (o.user_email || 'Customer') + '</div>' +
        '<div class="task-list">' +
          items.map(function(i) {
            const name = getProdName(i.productId || i.product_id);
            const qty = i.quantity || i.qty || 1;
            const hasBraai = i.braai;
            const papCount = i.pap || 0;
            if (!hasBraai && papCount === 0) return '';
            return '<div class="task-item">' +
              '<div class="task-name">' + qty + '&times; ' + name + '</div>' +
              '<div class="task-tags">' +
                (hasBraai ? '<span class="tag-braai">&#x1F525; BRAAI</span>' : '') +
                (papCount > 0 ? '<span class="tag-pap">&#x1F35A; ' + papCount + '&times; PAP</span>' : '') +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>' +
        (totalOrderPap > 0 ? '<div class="pap-total">&#x1F35A; Total pap for this order: <strong>' + totalOrderPap + ' portion' + (totalOrderPap>1?'s':'') + '</strong></div>' : '') +
      '</div>' +
      '<button class="done-btn" onclick="markDone('' + o.id + '', this)">&#x2713; DONE &mdash; Send to Packaging</button>' +
    '</div>';
  }).join('');

  _prevIds = currentIds;
}

window.markDone = async function(id, btn) {
  btn.disabled = true; btn.textContent = 'Updating...';
  const { error } = await supabase.from('orders').update({ status: 'packaging', updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { showToast('Error: ' + error.message, 'error'); btn.disabled = false; btn.textContent = '&#x2713; DONE &mdash; Send to Packaging'; return; }
  await load();
};

load();
setInterval(load, 15000);
</script>
</body>
</html>
