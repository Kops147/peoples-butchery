<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — The Peoples Butchery | Fresh Meat Online</title>
  <meta name="description"
    content="Order fresh raw meat and cooked South African meals online from The Peoples Butchery. T-bones, boerewors, lamb chops, pap meals and more. Delivered to Pretoria.">
  <link rel="stylesheet" href="css/style.css">
  <script>
    window.onerror = function(msg, url, line, col, error) {
      console.error('GLOBAL ERROR:', msg, 'at', url, 'line', line);
      const toast = document.getElementById('toast-container');
      if (toast) {
        const div = document.createElement('div');
        div.style.background = 'var(--error)';
        div.style.color = 'white';
        div.style.padding = '12px';
        div.style.margin = '10px';
        div.style.borderRadius = '8px';
        div.textContent = '⚠️ Script Error: ' + msg;
        toast.appendChild(div);
      }
      return false;
    };
  </script>
  <style>
    body {
      padding-top: var(--navbar-h);
      background: var(--bg-base);
    }

    .shop-layout {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .shop-header {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media(min-width: 768px) {
      .shop-header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .shop-title {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 2rem;
      margin: 0;
    }

    .shop-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 250px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
      z-index: 1;
    }

    #product-search {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 16px 12px 42px;
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
    }

    #product-search:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 10px 20px;
      border-radius: var(--radius-full);
      white-space: nowrap;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 600;
      transition: var(--transition);
      cursor: pointer;
    }

    .filter-btn:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    #products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .view-cart-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--primary);
      color: white;
      padding: 16px 24px;
      border-radius: var(--radius-full);
      box-shadow: 0 8px 24px rgba(192, 57, 43, 0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      font-weight: 700;
      z-index: 100;
      transition: var(--transition);
    }

    .view-cart-fab:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(192, 57, 43, 0.4);
    }

    .cart-badge {
      background: white;
      color: var(--primary);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.75rem;
    }

    /* Product Card Styling Overrides for ShopNew */
    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary-glow);
    }

    .product-img {
      height: 200px;
      position: relative;
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-name {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
    }

    .product-unit {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .weight-ctrl-wrap {
      margin-top: auto;
      padding-top: 16px;
    }

    .weight-dual-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .weight-field {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 8px;
    }

    .weight-inp {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
      outline: none;
    }

    .weight-lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .btn-add {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: var(--radius-lg);
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-add:hover {
      background: var(--primary-dark);
    }

    .btn-in-cart {
      background: transparent;
      border: 1px solid var(--error);
      color: var(--error);
    }

    .product-category-tag {
      position: absolute;
      top: 12px;
      left: 12px;
    }
  </style>
</head>

<body>
  <div id="toast-container"></div>
  <div id="app-navbar"></div>

  <div class="shop-layout">
    <header class="shop-header">
      <h1 class="shop-title">Our Catalog</h1>
      <div class="shop-controls">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="product-search" placeholder="Search for meat, meals, sides...">
        </div>
      </div>
    </header>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">🍖 All Products</button>
      <button class="filter-btn" data-filter="raw">🥩 Raw Meats</button>
      <button class="filter-btn" data-filter="cooked">🍽️ Cooked Meals</button>
    </div>

    <div id="products-grid">
      <div class="empty-state" style="grid-column: 1/-1">
        <div class="empty-icon">⏳</div>
        <div class="empty-title">Loading the finest cuts...</div>
      </div>
    </div>
  </div>

  <a href="cart.html" class="view-cart-fab">
    <span>🛒 View Cart</span>
    <span class="cart-badge" id="cart-badge-count">0</span>
  </a>

  <footer class="footer" style="padding:40px 0;border-top:1px solid var(--border);text-align:center;background:var(--bg-card);margin-top:60px">
    <div class="container">
      <p style="font-size:0.8rem;color:var(--text-muted)">&copy; 2026 The Peoples Butchery. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script type="module" src="js/shop.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar({ active: 'shop', showCart: false });
    });
  </script>
</body>

</html>
