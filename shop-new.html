<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — The Peoples Butchery | Fresh Meat Online</title>
  <meta name="description" content="Order fresh raw meat and cooked South African meals online from The Peoples Butchery. Delivered to Pretoria.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #c0392b;
      --primary-light: #e74c3c;
      --primary-glow: rgba(192, 57, 43, 0.1);
      --success: #27ae60;
      --warning: #f39c12;
      --error: #e74c3c;
      --bg-base: #f8f9fa;
      --bg-card: #ffffff;
      --bg-elevated: #ecf0f1;
      --text-primary: #2c3e50;
      --text-secondary: #7f8c8d;
      --text-muted: #95a5a6;
      --border: #ecf0f1;
      --radius: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --transition: all 0.3s ease;
      --navbar-h: 64px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.6;
      padding-top: var(--navbar-h);
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--navbar-h);
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 1000;
      box-shadow: var(--shadow-sm);
    }

    .navbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--primary);
      flex-shrink: 0;
    }

    .brand-logo {
      font-size: 1.5rem;
    }

    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Main Layout */
    .shop-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .shop-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .shop-controls {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: var(--transition);
      color: var(--text-secondary);
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--primary-glow);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .product-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .product-image {
      width: 100%;
      height: 180px;
      background: var(--bg-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      overflow: hidden;
      position: relative;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--primary);
      color: white;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .product-badge.cooked {
      background: var(--warning);
    }

    .product-info {
      padding: 16px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .product-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 4px;
      color: var(--text-primary);
    }

    .product-category {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .product-unit {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .product-controls {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .qty-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
      text-align: center;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-light);
    }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: #d5dbdb;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    .btn-full {
      width: 100%;
    }

    /* Cart */
    .cart-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1099;
    }

    .cart-overlay.open {
      display: block;
    }

    .cart-panel {
      display: none;
      position: fixed;
      right: -400px;
      top: 0;
      width: 400px;
      height: 100vh;
      background: var(--bg-card);
      border-left: 1px solid var(--border);
      z-index: 1100;
      transition: right 0.3s ease;
      flex-direction: column;
      box-shadow: -4px 0 12px rgba(0,0,0,0.1);
      overflow-y: auto;
    }

    .cart-panel.open {
      display: flex;
      right: 0;
    }

    .cart-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .cart-header h2 {
      font-size: 1.3rem;
      margin: 0;
    }

    .cart-close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .cart-item-img {
      width: 60px;
      height: 60px;
      background: var(--bg-elevated);
      border-radius: var(--radius);
      flex-shrink: 0;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-item-content {
      flex: 1;
    }

    .cart-item-name {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .cart-item-qty {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .cart-item-price {
      font-weight: 700;
      color: var(--primary);
    }

    .cart-item-remove {
      background: none;
      border: none;
      color: var(--error);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0;
      flex-shrink: 0;
    }

    .cart-footer {
      padding: 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg-elevated);
    }

    .cart-summary {
      margin-bottom: 16px;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }

    .cart-row.total {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 8px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .empty-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 0.95rem;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 2000;
    }

    .toast {
      background: var(--bg-card);
      color: var(--text-primary);
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      margin-bottom: 10px;
      box-shadow: var(--shadow-md);
      border-left: 4px solid var(--primary);
      animation: slideIn 0.3s ease;
    }

    .toast.success {
      border-left-color: var(--success);
    }

    .toast.error {
      border-left-color: var(--error);
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .shop-container {
        padding: 16px;
      }

      .shop-header {
        flex-direction: column;
        align-items: stretch;
      }

      .shop-title {
        font-size: 1.5rem;
      }

      .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }

      .cart-panel {
        width: 100%;
        right: -100%;
      }

      .shop-controls {
        flex-direction: column;
      }

      .search-input {
        width: 100%;
      }
    }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--error);
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .cart-btn {
      position: relative;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">
        <div class="brand-logo">🥩</div>
        <span>The Peoples Butchery</span>
      </a>
      <div class="navbar-actions">
        <button class="btn btn-secondary btn-sm" id="cart-toggle-btn">
          🛒 Cart <span class="cart-badge" id="cart-badge" style="display: none;">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="shop-container">
    <!-- Header -->
    <div class="shop-header">
      <h1 class="shop-title">Our Products</h1>
      <div class="shop-controls">
        <input type="text" id="search-input" class="search-input" placeholder="Search products...">
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">🍖 All</button>
          <button class="filter-btn" data-filter="raw">🥩 Raw</button>
          <button class="filter-btn" data-filter="cooked">🍽️ Cooked</button>
        </div>
      </div>
    </div>

    <!-- Products Grid -->
    <div class="products-grid" id="products-grid">
      <div class="empty-state">
        <div class="empty-icon">⏳</div>
        <div class="empty-title">Loading products...</div>
      </div>
    </div>
  </div>

  <!-- Cart Panel -->
  <div class="cart-overlay" id="cart-overlay"></div>
  <div class="cart-panel" id="cart-panel">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="cart-close-btn" id="cart-close-btn">✕</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-summary" id="cart-summary"></div>
      <button class="btn btn-primary btn-full" id="checkout-btn">Checkout</button>
      <button class="btn btn-secondary btn-full" id="clear-cart-btn" style="margin-top: 8px;">Clear Cart</button>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script>
    // ============================================
    // PRODUCT CATALOG (Hardcoded for reliability)
    // ============================================
    const PRODUCTS = [
      // Raw Meats
      { id: '1125', name: 'Short Rib', price: 130.00, unit: 'per kg', category: 'raw', icon: '🥩' },
      { id: '1126', name: 'Beef Stew', price: 100.00, unit: 'per kg', category: 'raw', icon: '🥩' },
      { id: '1124', name: 'Brisket', price: 130.00, unit: 'per kg', category: 'raw', icon: '🥩' },
      { id: '137', name: 'Bulk Mince', price: 80.00, unit: 'per kg', category: 'raw', icon: '🥩' },
      { id: '1123', name: 'Chuck', price: 130.00, unit: 'per kg', category: 'raw', icon: '🥩' },
      { id: '1166', name: 'Frozen Chicken Hearts', price: 35.00, unit: 'each', category: 'raw', icon: '🍗' },
      { id: '37', name: 'Lamb Tripe', price: 30.00, unit: 'per kg', category: 'raw', icon: '🐑' },
      { id: '291', name: 'Lamb Chops', price: 140.00, unit: 'per kg', category: 'raw', icon: '🐑' },
      { id: '1179', name: 'Lamb Stew', price: 140.00, unit: 'per kg', category: 'raw', icon: '🐑' },
      { id: '1206', name: 'Boerewors', price: 95.99, unit: 'per kg', category: 'raw', icon: '🌭' },

      // Cooked Meals
      { id: '130', name: '2 Steak 1 Wors Meal', price: 90.00, unit: 'each', category: 'cooked', icon: '🍽️' },
      { id: '124', name: 'Pink Lentils (Cooked)', price: 15.00, unit: 'per 200g', category: 'cooked', icon: '🍜' },
      { id: 'meal_steak_wors_r65', name: 'Steak + Wors Meal', price: 65.00, unit: 'each', category: 'cooked', icon: '🍽️' },
      { id: 'atchar', name: '1 Steak 1 Wors 1 Chicken', price: 75.00, unit: 'each', category: 'cooked', icon: '🍽️' },
      { id: 'curry-chillies', name: 'Curry Chillies (Cooked)', price: 10.00, unit: 'each', category: 'cooked', icon: '🌶️' },
      { id: '1112', name: 'Chilli Bites', price: 350.00, unit: 'each', category: 'cooked', icon: '🌶️' },
    ];

    // ============================================
    // STATE
    // ============================================
    let cart = [];
    let currentFilter = 'all';
    let searchQuery = '';

    // ============================================
    // UTILS
    // ============================================
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.getElementById('toast-container').appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function formatCurrency(amount) {
      return `R${amount.toFixed(2)}`;
    }

    function getCartTotal() {
      return cart.reduce((sum, item) => {
        const product = PRODUCTS.find(p => p.id === item.id);
        return sum + (product?.price || 0) * item.qty;
      }, 0);
    }

    function getCartCount() {
      return cart.reduce((sum, item) => sum + item.qty, 0);
    }

    // ============================================
    // RENDER
    // ============================================
    function renderProducts() {
      const grid = document.getElementById('products-grid');
      let filtered = PRODUCTS;

      // Filter by category
      if (currentFilter !== 'all') {
        filtered = filtered.filter(p => p.category === currentFilter);
      }

      // Filter by search
      if (searchQuery) {
        filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
      }

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">No products found</div>
            <div class="empty-desc">Try adjusting your filters or search</div>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(product => {
        const cartItem = cart.find(c => c.id === product.id);
        const qty = cartItem?.qty || 0;

        return `
          <div class="product-card">
            <div class="product-image">
              ${product.icon}
              <div class="product-badge ${product.category === 'cooked' ? 'cooked' : ''}">
                ${product.category === 'cooked' ? '🍽️ Cooked' : '🥩 Raw'}
              </div>
            </div>
            <div class="product-info">
              <div class="product-name">${product.name}</div>
              <div class="product-category">${product.unit}</div>
              <div class="product-price">${formatCurrency(product.price)}</div>
              <div class="product-controls">
                <input type="number" class="qty-input" value="${Math.max(1, qty)}" min="1" id="qty-${product.id}">
                <button class="btn btn-primary btn-sm" onclick="addToCart('${product.id}')">Add</button>
                ${qty > 0 ? `<button class="btn btn-secondary btn-sm" onclick="removeFromCart('${product.id}')">Remove</button>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCart() {
      const cartItems = document.getElementById('cart-items');
      const cartSummary = document.getElementById('cart-summary');
      const cartBadge = document.getElementById('cart-badge');

      const count = getCartCount();
      if (count > 0) {
        cartBadge.textContent = count;
        cartBadge.style.display = 'flex';
      } else {
        cartBadge.style.display = 'none';
      }

      if (cart.length === 0) {
        cartItems.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🛒</div>
            <div class="empty-title">Your cart is empty</div>
            <div class="empty-desc">Add some items to get started!</div>
          </div>
        `;
        cartSummary.innerHTML = '';
        return;
      }

      cartItems.innerHTML = cart.map(item => {
        const product = PRODUCTS.find(p => p.id === item.id);
        if (!product) return '';

        const total = product.price * item.qty;

        return `
          <div class="cart-item">
            <div class="cart-item-img">${product.icon}</div>
            <div class="cart-item-content">
              <div class="cart-item-name">${product.name}</div>
              <div class="cart-item-qty">${item.qty} × ${formatCurrency(product.price)}</div>
              <div class="cart-item-price">${formatCurrency(total)}</div>
            </div>
            <button class="cart-item-remove" onclick="removeFromCart('${product.id}')">✕</button>
          </div>
        `;
      }).join('');

      const total = getCartTotal();
      cartSummary.innerHTML = `
        <div class="cart-row">
          <span>Subtotal</span>
          <span>${formatCurrency(total)}</span>
        </div>
        <div class="cart-row">
          <span>Items</span>
          <span>${getCartCount()}</span>
        </div>
        <div class="cart-row total">
          <span>Total</span>
          <span>${formatCurrency(total)}</span>
        </div>
      `;
    }

    // ============================================
    // CART OPERATIONS
    // ============================================
    window.addToCart = function(productId) {
      const qtyInput = document.getElementById(`qty-${productId}`);
      const qty = parseInt(qtyInput?.value || 1);

      if (qty < 1) {
        showToast('Minimum order is 1', 'error');
        return;
      }

      const product = PRODUCTS.find(p => p.id === productId);
      if (!product) return;

      const existing = cart.find(c => c.id === productId);
      if (existing) {
        existing.qty = qty;
      } else {
        cart.push({ id: productId, qty });
      }

      showToast(`✅ ${product.name} added to cart!`);
      renderCart();
      renderProducts();
    };

    window.removeFromCart = function(productId) {
      cart = cart.filter(c => c.id !== productId);
      renderCart();
      renderProducts();
    };

    // ============================================
    // EVENT LISTENERS
    // ============================================
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderProducts();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderProducts();
      });
    });

    document.getElementById('cart-toggle-btn').addEventListener('click', () => {
      document.getElementById('cart-panel').classList.add('open');
      document.getElementById('cart-overlay').classList.add('open');
    });

    document.getElementById('cart-close-btn').addEventListener('click', () => {
      document.getElementById('cart-panel').classList.remove('open');
      document.getElementById('cart-overlay').classList.remove('open');
    });

    document.getElementById('cart-overlay').addEventListener('click', () => {
      document.getElementById('cart-panel').classList.remove('open');
      document.getElementById('cart-overlay').classList.remove('open');
    });

    document.getElementById('clear-cart-btn').addEventListener('click', () => {
      if (cart.length === 0) return;
      if (confirm('Clear your entire cart?')) {
        cart = [];
        renderCart();
        renderProducts();
        showToast('Cart cleared');
      }
    });

    document.getElementById('checkout-btn').addEventListener('click', () => {
      if (cart.length === 0) {
        showToast('Your cart is empty!', 'error');
        return;
      }
      alert(`Order total: ${formatCurrency(getCartTotal())}\n\nThis is a demo. Implement payment integration next!`);
    });

    // ============================================
    // INIT
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      console.log('✅ Shop loaded with', PRODUCTS.length, 'products');
      renderProducts();
      renderCart();
    });
  </script>
</body>
</html>
